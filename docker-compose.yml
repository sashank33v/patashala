services:
  backend:
    build:
      context: ./backend
    container_name: patashala-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://patashala:patashala@postgres:5432/patashala
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: patashala-postgres
    environment:
      POSTGRES_DB: patashala
      POSTGRES_USER: patashala
      POSTGRES_PASSWORD: patashala
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: patashala-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
