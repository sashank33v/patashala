name: patashala
description: Student Learning Interactive Visualization App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.4.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  google_fonts: 6.2.1
  shared_preferences: ^2.3.2

dependency_overrides:
  google_fonts:
    path: local_google_fonts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
